# Desktop CI — source integrity + authority tests.
# Does NOT claim electron-builder signed installers or notarization.
name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - 'packs/science-desktop/**'
      - 'agent/**'
      - 'docs/science/fusion-sources.lock.json'
      - 'packs/science/skills/registry.json'
      - 'docs/VERSIONING.md'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packs/science-desktop/**'
      - 'agent/**'
      - 'docs/science/**'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authority:
    name: Desktop authority suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packs/science-desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packs/science-desktop/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "WARN: no package-lock.json — using npm install (non-reproducible)"
            npm install --no-audit --no-fund
          fi

      - name: Authority + release honesty + office gate
        run: npm run test:authority

      # 4,315 unit tests that existed for months while nothing ran them: no
      # config, no script, 597 failing — some against behaviour this fork
      # changed deliberately. Wired in LS5-K33; exclusions derive from the
      # tsconfig production-exclusion list (see vitest.config.ts).
      - name: Unit suites (vitest)
        run: npm run test:unit

      # LS5-D1-01: required. Proves the tsconfig exclusion list still matches
      # the computed import graph — an excluded file must be genuinely
      # unreachable, or exclusion would be hiding real type errors.
      - name: Production source graph matches tsconfig exclusions
        run: npx tsx scripts/desktop-source-graph.mts --check

      # LS5-D1-02: required. 0 errors on both projects (node + web).
      #
      # History: 1566 -> 65 by excluding the unreachable Open Science code the
      # include globs were dragging in (LS5-D1-01), then 65 -> 0 by fixing every
      # error in code that actually ships. The web project was never counted
      # before, because `typecheck` runs node && web and node always failed
      # first; it contributed a further 223.
      #
      # This gate is only meaningful because of what it is NOT allowed to do:
      # nothing here may be silenced with `any`, ts-ignore, skipLibCheck, or by
      # adding a file to a tsconfig `exclude` list. An exclusion is legitimate
      # only when the source graph proves the file unreachable, which the step
      # above enforces on every run. Fix the error or fix the graph.
      - name: Typecheck (node + web, 0 errors required)
        run: npm run typecheck

      - name: Builder config sanity (no aipoch feed, adhoc-sign exists)
        run: |
          test -f build/adhoc-sign.cjs
          for forbidden in \
            'statics.aipoch.com' \
            'executableName: open-science' \
            'artifactName: aipoch-' \
            'from: cli$' \
            'packages/open-science'; do
            if grep -q "$forbidden" electron-builder.yml; then
              echo "FAIL: forbidden legacy builder setting: $forbidden" >&2
              exit 1
            fi
          done

  # A real renderer build is deliberately distinct from the pack-dir smoke
  # shell.  This job produces no installer and makes no signing/notarization
  # claim: it proves only that this exact source revision can assemble the full
  # macOS app bundle and that the bundle has the expected sealed inputs.
  full-package:
    name: Desktop macOS full package (unsigned)
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: packs/science-desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packs/science-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build full renderer and unsigned macOS app
        run: npm run dist:full

      - name: Verify full app contents and write provenance
        run: |
          set -euo pipefail
          app_path="$(find dist -maxdepth 2 -type d -name 'Lumen Science Desktop.app' -print -quit)"
          test -n "$app_path"
          test -f "$app_path/Contents/MacOS/Lumen Science Desktop"
          test -f "$app_path/Contents/Resources/app.asar"
          test -f out/main/index.js
          test -f out/preload/index.js
          test -f out/renderer/index.html
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")" = 'com.exergyleizhou-ux.lumen-science-desktop'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app_path/Contents/Info.plist")" = 'Lumen Science Desktop'
          codesign --verify --deep --strict --verbose=2 "$app_path"
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "app_path=${app_path}"
            echo "bundle_id=$( /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist" )"
            echo "display_name=$( /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app_path/Contents/Info.plist" )"
            shasum -a 256 "$app_path/Contents/MacOS/Lumen Science Desktop"
            shasum -a 256 "$app_path/Contents/Resources/app.asar"
            codesign -dv --verbose=2 "$app_path" 2>&1
          } >"$RUNNER_TEMP/desktop-full-package-provenance.txt"

      - name: Upload unsigned package provenance
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: desktop-full-package-provenance
          path: ${{ runner.temp }}/desktop-full-package-provenance.txt
          retention-days: 14

  # The engine-less E2E launches the REAL built app. Every suite above checks a
  # module in isolation; none of them opens a window, which is how this pack
  # once shipped a blank one — #root mounted, zero children — with 24 green
  # authority suites. Headless via xvfb; Electron cannot open a window without
  # a display.
  #
  # The LIVE suite runs in its own job below (live-e2e), which builds the
  # engine binary first — it must never silently skip, because it is the only
  # coverage of the permission handshake and the evidence chain.
  e2e:
    name: Desktop headed E2E (no engine)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packs/science-desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Headed E2E under a virtual display
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: e2e-traces
          path: packs/science-desktop/test-results/
          retention-days: 7

  # The LIVE suite: a real engine binary, a real permission prompt, a real
  # sandboxed cell, the full evidence chain. This is the only automated
  # coverage of the approval handshake — the engine-less suite above proves
  # fail-closed and nothing else. It was previously local-only with the gap
  # stated in a comment; LS5-K34 pays the cargo-build cost instead. First run
  # compiles the workspace (~40 min); the cache makes later runs minutes.
  live-e2e:
    name: Desktop live E2E (real engine)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install protoc
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y protobuf-compiler

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: ${{ runner.os }}-cargo-lumen-bin-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lumen-bin-

      - name: Build the engine
        working-directory: agent
        run: cargo build --bin lumen --locked

      # LS5-D8: Python discovery diagnosis on the runner BEFORE Electron starts.
      # This is a read-only diagnostic, not a production fix. It proves whether
      # the runner has a Python the Electron app CAN discover. Must NOT be used
      # to paper over a real discovery failure.
      - name: Runner Python diagnosis (read-only)
        run: |
          set +e
          echo "=== runner python facts ==="
          command -v python3 || echo "no python3 on PATH"
          python3 --version 2>&1 || echo "python3 --version failed"
          realpath "$(command -v python3 2>/dev/null)" 2>/dev/null || echo "cannot canonicalize"
          which python3 2>/dev/null || echo "which failed"
          ls -la /usr/bin/python3* 2>/dev/null || echo "no /usr/bin/python3*"
          ls -la /usr/bin/python3 2>/dev/null || echo "no /usr/bin/python3"
          file /usr/bin/python3 2>/dev/null || echo "cannot file python3"
          echo "uname: $(uname -a)"
          echo "PATH=$PATH"
          set -e
          exit 0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: packs/science-desktop
        run: npm ci --no-audit --no-fund

      - name: Install Playwright system dependencies
        working-directory: packs/science-desktop
        run: npx playwright install-deps chromium

      - name: Environment discovery production smoke
        working-directory: packs/science-desktop
        run: |
          npx tsx scripts/test-environment-smoke.mts

      - name: Live E2E under a virtual display
        working-directory: packs/science-desktop
        env:
          # The engine authenticates against a key that offline-deterministic
          # science routes never spend; the handshake needs one to exist.
          XAI_API_KEY: live-e2e-ci-key
          GROK_TELEMETRY_ENABLED: 'false'
          GROK_DISABLE_AUTOUPDATER: '1'
        run: xvfb-run --auto-servernum npm run test:e2e:live

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: live-e2e-traces
          path: packs/science-desktop/test-results/
          retention-days: 7
