# Desktop CI — source integrity + authority tests.
# Does NOT claim electron-builder signed installers or notarization.
name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - 'packs/science-desktop/**'
      - 'docs/science/fusion-sources.lock.json'
      - 'packs/science/skills/registry.json'
      - 'docs/VERSIONING.md'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packs/science-desktop/**'
      - 'docs/science/**'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authority:
    name: Desktop authority suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packs/science-desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packs/science-desktop/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "WARN: no package-lock.json — using npm install (non-reproducible)"
            npm install --no-audit --no-fund
          fi

      - name: Authority + release honesty + office gate
        run: npm run test:authority

      # LS5-D1-01: required. Proves the tsconfig exclusion list still matches
      # the computed import graph — an excluded file must be genuinely
      # unreachable, or exclusion would be hiding real type errors.
      - name: Production source graph matches tsconfig exclusions
        run: npx tsx scripts/desktop-source-graph.mts --check

      # LS5-D1-02 IN PROGRESS — this is NOT a passing gate yet.
      #
      # Errors went 1566 -> 65 by excluding the unreachable Open Science code
      # that the include globs were dragging in (see desktop-source-graph.mts).
      # Every one of the 65 remaining errors is in code that actually ships, so
      # they must be fixed rather than excluded. Until they are, this step stays
      # advisory — but it now reports a real number instead of masking ~1500.
      #
      # Do not delete this step and do not raise the tolerance; the exit
      # criterion is 0 errors, at which point continue-on-error is removed.
      - name: Typecheck (advisory — 65 known errors in shipped code, tracked)
        run: npm run typecheck
        continue-on-error: true

      - name: Builder config sanity (no aipoch feed, adhoc-sign exists)
        run: |
          test -f build/adhoc-sign.cjs
          ! grep -q 'statics.aipoch.com' electron-builder.yml
          ! grep -q 'executableName: open-science' electron-builder.yml
          ! grep -q 'artifactName: aipoch-' electron-builder.yml
          ! grep -q 'from: cli$' electron-builder.yml
          ! grep -q 'packages/open-science' electron-builder.yml
