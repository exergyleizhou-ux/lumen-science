name: Debug wrapper repro

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/debug-repro.yml'
      - 'scripts/debug-repro.py'

jobs:
  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Environment facts
        run: |
          bash --version | head -1
          echo "export -p count: $(builtin export -p | wc -l)"
          builtin export -p | command grep -viE '_proxy=' | head -60
      - name: Wrapper reproduction
        run: python3 scripts/debug-repro.py
