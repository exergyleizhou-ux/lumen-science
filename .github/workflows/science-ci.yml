name: Lumen Science CI

on:
  push:
    branches: [main]
    paths:
      - 'packs/science/**'
      - 'scripts/dogfood-science-offline.sh'
      - 'scripts/science-machine-gates.sh'
      - 'scripts/science-go-module-boundary.sh'
      - 'scripts/verify-release-assets.sh'
      - 'scripts/generate-science-status.py'
      - 'scripts/verify-science-status.py'
      - 'scripts/test-science-status.py'
      - 'docs/science/status/current.json'
      - 'docs/science/fusion-sources.lock.json'
      # agent/**: same reasoning as the pull_request trigger below — core
      # changes reach main through merges, and the record on main should carry
      # the same evidence the PR gate demanded.
      - 'agent/**'
      - 'VERSION'
      - 'packs/science/VERSION'
  pull_request:
    branches: [main]
    paths:
      - 'packs/science/**'
      - 'scripts/**'
      - 'docs/science/**'
      # agent/** (not just the science crate): three of main's four REQUIRED
      # status contexts live in this workflow, and required checks that never
      # fire never report — so a PR touching only core crates (exactly what a
      # core-security sync is) was unmergeable by construction. PR #12 had to
      # be unblocked by manual workflow_dispatch; this makes the next one
      # merge like any other PR. Core changes genuinely can break the science
      # crate — one cargo workspace — so running these jobs on them is not
      # merely ritual.
      - 'agent/**'
      - 'packs/science/VERSION'
  workflow_dispatch:

concurrency:
  group: science-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: packs/science
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 1.23+ avoids macOS 15 dyld "missing LC_UUID" abort on pure-Go tests
          go-version: '1.23'

      - name: Test (unit + seqbench + pipeline)
        env:
          # Prefer pure-Go binaries on hosted macOS runners
          CGO_ENABLED: '0'
        run: |
          go test ./mcp ./mcp/artifacts/... ./mcp/notebook/... ./mcp/reviewer/... ./mcp/http_bridge/... \
            ./standalone/internal/seqbench/... ./standalone/internal/pipeline/... \
            ./standalone/internal/projectstore/... ./renderers/... \
            -count=1 -timeout=60s

      - name: Vet
        run: go vet ./mcp ./mcp/artifacts/... ./mcp/notebook/... ./mcp/reviewer/... ./mcp/http_bridge/... ./renderers/... ./standalone/...

      - name: CLI smoke (seq + pipeline offline)
        run: make smoke

  gates:
    name: Machine honesty gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # verify-science-status regenerates from the tree and needs real git
          # metadata (commit + committer date), which a shallow clone still has,
          # but tag enumeration for the release block does not.
          fetch-depth: 0

      - name: Science machine gates
        run: bash scripts/science-machine-gates.sh

      - name: Rust Core VERSION honesty
        run: python3 scripts/release_version.py --root . check

      - name: Core drift fixture self-test
        run: python3 scripts/check-core-drift.py --self-test

      - name: Checkout audited Lumen main head for Core drift (exact SHA)
        uses: actions/checkout@v4
        with:
          repository: exergyleizhou-ux/lumen
          ref: dc563b1e0db9eaca7e970d56d7816e1522511723
          path: .tmp/lumen-core-drift-pin
          persist-credentials: false
          fetch-depth: 1

      - name: Core drift audited-head manifest comparison
        env:
          CORE_DRIFT_UPSTREAM_ROOT: ${{ github.workspace }}/.tmp/lumen-core-drift-pin
        run: |
          python3 scripts/check-core-drift.py \
            --science-root . \
            --upstream-root "$CORE_DRIFT_UPSTREAM_ROOT" \
            --lock docs/science/5.0/core-v0.1.251-admission.lock.json

      - name: Go module boundary (product vs legacy)
        run: bash scripts/science-go-module-boundary.sh

      # LS5-F0-01: status truth. The negative tests run first — if the verifier
      # cannot detect a corrupted status file, its pass on the real one is
      # meaningless.
      - name: Status gate self-test (negative cases)
        run: python3 scripts/test-science-status.py

      - name: Verify machine-readable status is fresh and honest
        run: python3 scripts/verify-science-status.py

      # The dossier verifier is the product's central claim: a third party can
      # check a result without trusting us. Its tamper tests run before the
      # other gates — a verifier that cannot detect tampering converts "nobody
      # checked" into "checked and passed", which is worse than none.
      - name: Dossier verifier detects tampering
        run: python3 scripts/test-verify-dossier.py

      # A pinned checksum is a security control only if the value is real.
      # Every non-action digest in a workflow must be attributed in
      # .github/pinned-digests.txt.
      - name: Every pinned digest is attributed
        run: python3 scripts/verify-pinned-digests.py

      # Apache-2.0 §4 obligations for source adopted from Open Science: every
      # modified file must carry a statement of changes, and the ledger's counts
      # and pin must be internally consistent. Now wired — it was held back
      # while 27 files still lacked a notice, since a knowingly-red required
      # gate only invites a `continue-on-error` that hides it.
      #
      # The freshness re-derivation needs an upstream clone, which CI does not
      # have; it reports as skipped rather than silently counted as passing.
      - name: Adoption provenance ledger is consistent
        run: python3 scripts/verify-adoption-provenance.py

  rust-science:
    name: Rust xai-grok-science (test + clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      # The Linux sandbox deliberately trusts only a root-owned, non-writable
      # /usr chain. GitHub runner images have occasionally shipped /usr owned
      # by the unprivileged runner user even though the directory remains
      # protected. Repair only that exact, auditable hosted-image condition;
      # self-hosted/unknown runners, symlinks, writable modes, unexpected
      # ownership, or an ineffective chown stay red.
      - name: Establish Linux workflow trust root
        env:
          EXPECTED_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RUNNER_ENVIRONMENT" == "github-hosted" \
            && "${RUNNER_OS:-}" == "Linux" \
            && "${GITHUB_ACTIONS:-}" == "true" ]] || {
            echo "::error::trust-root repair is restricted to GitHub-hosted Linux runners"
            exit 1
          }

          python_path="$(readlink -e /usr/bin/python3)"
          [[ "$python_path" == /usr/* ]] || {
            echo "::error::python3 canonicalized outside /usr: $python_path"
            exit 1
          }
          runner_uid="$(id -u)"

          id
          stat -Lc '%n uid=%u gid=%g mode=%a type=%F dev=%d ino=%i' \
            / /usr /usr/bin "$python_path"
          namei -l /usr/bin/python3

          [[ ! -L /usr && -d /usr ]] || {
            echo "::error::/usr must be a real directory"
            exit 1
          }
          usr_uid="$(stat -Lc '%u' /usr)"
          usr_mode="$(stat -Lc '%a' /usr)"
          (( (8#$usr_mode & 8#022) == 0 )) || {
            echo "::error::/usr is group/other writable (mode=$usr_mode)"
            exit 1
          }

          case "$usr_uid" in
            0) ;;
            "$runner_uid")
              sudo chown --no-dereference root:root -- /usr
              ;;
            *)
              echo "::error::/usr has unexpected owner uid=$usr_uid"
              exit 1
              ;;
          esac

          for protected_path in / /usr /usr/bin "$python_path"; do
            [[ ! -L "$protected_path" ]] || {
              echo "::error::$protected_path must not be a symlink"
              exit 1
            }
            protected_uid="$(stat -Lc '%u' "$protected_path")"
            protected_mode="$(stat -Lc '%a' "$protected_path")"
            [[ "$protected_uid" == 0 ]] || {
              echo "::error::$protected_path is not root-owned (uid=$protected_uid)"
              exit 1
            }
            (( (8#$protected_mode & 8#022) == 0 )) || {
              echo "::error::$protected_path is group/other writable (mode=$protected_mode)"
              exit 1
            }
          done

          stat -Lc '%n uid=%u gid=%g mode=%a type=%F dev=%d ino=%i' \
            / /usr /usr/bin "$python_path"

      - name: Install protoc
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y protobuf-compiler

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: ${{ runner.os }}-cargo-science-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-science-

      - name: cargo test -p xai-grok-science --lib
        run: cargo test -p xai-grok-science --lib --locked -- --test-threads=2

      - name: Workflow authority cancellation, replay, and rollback proofs
        run: |
          set -euo pipefail
          tests=(
            session::acp_session::run_loop::yolo_toggle_report_tests::closed_begin_receiver_returns_only_a_prepared_success_for_interruption
            session::acp_session::science::workflow_authority_failure_tests::undelivered_begin_interrupts_pending_approval_without_probe_or_execution
            session::acp_session::science::workflow_authority_failure_tests::terminal_replay_rejects_missing_duplicate_nonfinal_or_tampered_finish_event
            session::acp_session::science::workflow_authority_failure_tests::recoverable_finish_event_failure_rolls_back_before_failed_terminal
          )
          for test_name in "${tests[@]}"; do
            output="$(
              CARGO_TERM_COLOR=never \
                cargo test -p xai-grok-shell --lib --locked \
                  "$test_name" -- --exact 2>&1
            )"
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -Fqx "test ${test_name} ... ok"
            printf '%s\n' "$output" | grep -Eq \
              'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in .+$'
          done

      # xai-grok-workspace + xai-grok-tools ran in NO job, and both were red:
      # 15 failures from fixtures that fed uncanonicalized temp paths into the
      # capability layer (invisible on Linux, where /tmp is not a symlink), and
      # 44 from tests that shell out to ripgrep. Both are now green and stay
      # that way only if something runs them.
      #
      # ripgrep is a real dependency of the grep/glob tools in a DEBUG build
      # (build.rs bundles it for release only), so the job installs it rather
      # than letting 43 tests quietly assert nothing.
      - name: Install ripgrep (grep/glob tools shell out to it)
        run: sudo apt-get update -y && sudo apt-get install -y ripgrep

      - name: cargo test -p xai-grok-workspace -p xai-grok-tools --lib
        run: cargo test -p xai-grok-workspace -p xai-grok-tools --lib --locked -- --test-threads=2

      - name: cargo clippy -p xai-grok-science -D warnings
        run: cargo clippy -p xai-grok-science --all-targets --locked -- -D warnings

      # Unit tests prove the protocol functions in-process. These selected
      # product tests prove that the shipped `lumen` composition root exposes
      # the same authority chain over ACP stdio: SessionActor, production
      # permission prompt, durable terminal state, and store-owned artifacts.
      # Every test is offline and uses the local mock inference server.
      - name: Build Lumen composition-root binary
        run: cargo build -p xai-grok-pager-bin --bin lumen --locked

      - name: Required offline Science built-binary authority proofs
        env:
          GROK_BINARY: ${{ github.workspace }}/agent/target/debug/lumen
        run: |
          set -euo pipefail
          tests=(
            test_stdio_science_seq_analyze_is_actor_gated_and_store_owned
            test_stdio_science_seq_analyze_boundaries_fail_closed
            test_stdio_science_seq_analyze_denied_writes_nothing
            test_stdio_science_seq_analyze_permission_timeout_writes_nothing
            test_stdio_science_seq_analyze_malformed_input_fails_without_outputs
            test_stdio_science_seq_analyze_allow_rejects_project_revision_race
            test_stdio_science_project_mutation_is_actor_gated_and_idempotent
            test_stdio_science_project_mutation_denied_writes_nothing
            test_stdio_science_project_mutation_fails_closed
            test_stdio_science_project_migrate_is_actor_gated_and_idempotent
            test_stdio_science_project_migrate_refusal_writes_no_project
            test_stdio_science_project_migrate_cancel_writes_no_project
            test_stdio_science_project_migrate_requires_migration_chain_gate
            test_stdio_science_project_migrate_timeout_writes_no_project
            test_stdio_science_project_migrate_allow_rejects_source_tamper
            test_stdio_science_project_migrate_recovers_journal_before_copy
            test_stdio_science_review_record_is_actor_gated_artifact_bound_and_idempotent
            test_stdio_science_review_record_denied_writes_no_review_or_artifact
            test_stdio_science_kernel_admission_is_actor_gated_and_store_owned
            test_stdio_science_kernel_admission_denied_writes_nothing
            test_stdio_science_skill_quarantine_is_actor_gated_store_owned_and_replayable
            test_stdio_science_skill_quarantine_denied_and_cancelled_write_nothing
            test_stdio_science_skill_quarantine_permission_timeout_writes_nothing
            test_stdio_science_skill_quarantine_boundaries_fail_closed
            test_stdio_science_workflow_execute_is_actor_gated_and_idempotent
            test_stdio_science_workflow_partial_artifact_registration_rolls_back
            test_stdio_science_workflow_deterministic_reuse_refuses_tampered_cas
            test_stdio_science_workflow_execute_retains_store_across_approval
            test_stdio_science_workflow_execute_retains_store_and_interpreter_across_approval
            test_stdio_science_workflow_execute_fails_closed
            test_stdio_science_workflow_execute_non_allow_terminals_run_nothing
            test_stdio_science_connector_fetch_product_path
            test_stdio_science_biomni_uniprot_capability_product_path
          )

          # libtest exits successfully when an exact filter matches zero tests.
          # Prove every required product test exists exactly once in the ignored
          # inventory before relying on the individual exit codes below.
          listed_tests="$(
            cargo test -p xai-grok-shell --test test_built_binary_e2e --locked \
              -- --list --ignored
          )"
          printf '%s\n' "$listed_tests"
          for test_name in "${tests[@]}"; do
            match_count="$(
              printf '%s\n' "$listed_tests" |
                awk -v expected="${test_name}: test" \
                  '$0 == expected { count += 1 } END { print count + 0 }'
            )"
            if [[ "$match_count" -ne 1 ]]; then
              echo "::error::required built-binary test '$test_name' appears $match_count times in the ignored test inventory"
              exit 1
            fi
          done

          for test_name in "${tests[@]}"; do
            set +e
            test_output="$(
              CARGO_TERM_COLOR=never \
                cargo test -p xai-grok-shell --test test_built_binary_e2e --locked \
                  "$test_name" -- --ignored --exact --test-threads=1 2>&1
            )"
            test_status=$?
            set -e
            printf '%s\n' "$test_output"
            if [[ "$test_status" -ne 0 ]]; then
              echo "::error::required built-binary test '$test_name' exited $test_status"
              exit "$test_status"
            fi

            passed_test_lines="$(
              printf '%s\n' "$test_output" |
                grep -Fxc "test ${test_name} ... ok" || true
            )"
            passed_summary_lines="$(
              printf '%s\n' "$test_output" |
                grep -Ecx 'test result: ok\. 1 passed; 0 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in .+$' ||
                true
            )"
            if [[ "$passed_test_lines" -ne 1 || "$passed_summary_lines" -ne 1 ]]; then
              echo "::error::required built-binary test '$test_name' did not prove exactly one passing test (test lines=$passed_test_lines, summaries=$passed_summary_lines)"
              exit 1
            fi
          done

  rust-science-macos-product:
    name: Rust Science macOS built-binary sandbox proof
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: brew install protobuf

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: ${{ runner.os }}-cargo-science-product-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-science-product-
            ${{ runner.os }}-cargo-science-

      - name: Build Lumen composition-root binary
        run: cargo build -p xai-grok-pager-bin --bin lumen --locked

      - name: Required macOS workflow sandbox product proofs
        env:
          GROK_BINARY: ${{ github.workspace }}/agent/target/debug/lumen
        run: |
          set -euo pipefail
          tests=(
            test_stdio_science_workflow_execute_is_actor_gated_and_idempotent
            test_stdio_science_workflow_partial_artifact_registration_rolls_back
            test_stdio_science_workflow_deterministic_reuse_refuses_tampered_cas
            test_stdio_science_workflow_execute_fails_closed
            test_stdio_science_workflow_execute_non_allow_terminals_run_nothing
            test_stdio_science_workflow_execute_macos_rejects_unprotected_interpreter_before_permission
            test_stdio_science_connector_fetch_product_path
            test_stdio_science_biomni_uniprot_capability_product_path
          )

          listed_tests="$(
            cargo test -p xai-grok-shell --test test_built_binary_e2e --locked \
              -- --list --ignored
          )"
          printf '%s\n' "$listed_tests"
          for test_name in "${tests[@]}"; do
            match_count="$(
              printf '%s\n' "$listed_tests" |
                awk -v expected="${test_name}: test" \
                  '$0 == expected { count += 1 } END { print count + 0 }'
            )"
            if [[ "$match_count" -ne 1 ]]; then
              echo "::error::required macOS built-binary test '$test_name' appears $match_count times"
              exit 1
            fi
          done

          for test_name in "${tests[@]}"; do
            set +e
            test_output="$(
              CARGO_TERM_COLOR=never \
                cargo test -p xai-grok-shell --test test_built_binary_e2e --locked \
                  "$test_name" -- --ignored --exact --test-threads=1 2>&1
            )"
            test_status=$?
            set -e
            printf '%s\n' "$test_output"
            if [[ "$test_status" -ne 0 ]]; then
              echo "::error::required macOS built-binary test '$test_name' exited $test_status"
              exit "$test_status"
            fi
            passed_test_lines="$(
              printf '%s\n' "$test_output" |
                grep -Fxc "test ${test_name} ... ok" || true
            )"
            passed_summary_lines="$(
              printf '%s\n' "$test_output" |
                grep -Ecx 'test result: ok\. 1 passed; 0 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in .+$' ||
                true
            )"
            if [[ "$passed_test_lines" -ne 1 || "$passed_summary_lines" -ne 1 ]]; then
              echo "::error::required macOS built-binary test '$test_name' did not prove exactly one passing test"
              exit 1
            fi
          done

  build:
    name: Cross-compile (${{ matrix.target.os }}-${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: darwin,  arch: arm64 }
          - { os: darwin,  arch: amd64 }
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
          - { os: windows, arch: amd64 }
    defaults:
      run:
        working-directory: packs/science
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build primary CLI + MCP servers
        run: |
          mkdir -p build
          VERSION=$(cat VERSION 2>/dev/null || cat ../../VERSION 2>/dev/null || echo "${GITHUB_SHA::7}")
          LDFLAGS="-s -w -X main.version=${VERSION}"
          ext=""
          [ "${{ matrix.target.os }}" = "windows" ] && ext=".exe"
          GOOS=${{ matrix.target.os }} GOARCH=${{ matrix.target.arch }} \
            go build -trimpath -ldflags="$LDFLAGS" \
            -o build/lumen-science-${{ matrix.target.os }}-${{ matrix.target.arch }}${ext} \
            ./standalone/cmd/science
          for bin in artifacts notebook reviewer http_bridge skill-migrate; do
            GOOS=${{ matrix.target.os }} GOARCH=${{ matrix.target.arch }} \
              go build -trimpath -ldflags="$LDFLAGS" \
              -o build/lumen-mcp-${bin}-${{ matrix.target.os }}-${{ matrix.target.arch }}${ext} \
              ./standalone/cmd/${bin}
          done

      - name: Verify binaries
        run: ls -lh build/ && file build/* | head -30

  e2e:
    name: E2E pipeline test
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        working-directory: packs/science
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build MCP binaries
        run: |
          for bin in artifacts notebook reviewer; do
            go build -o lumen-mcp-${bin} ./standalone/cmd/${bin}
          done

      - name: Run E2E tests
        run: |
          export PATH="$(pwd):$PATH"
          go test ./e2e/... -v -count=1 -timeout=120s

  release-dry-run:
    name: Release build + SHA256SUMS
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, build, gates, rust-science]
    defaults:
      run:
        working-directory: packs/science
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: make release
        run: |
          VERSION=$(cat VERSION 2>/dev/null || cat ../../VERSION)
          make release VERSION="$VERSION"

      - name: Verify SHA256SUMS
        run: |
          cd dist/science-release
          test -f SHA256SUMS
          # shasum -c is available on ubuntu via sha256sum -c after format convert
          while read -r hash file; do
            echo "$hash  $file" | sha256sum -c -
          done < SHA256SUMS
          ls -lh
          wc -l SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-science-release-${{ github.sha }}
          path: packs/science/dist/science-release/*
          retention-days: 14
