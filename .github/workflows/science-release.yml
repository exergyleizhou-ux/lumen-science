# Science CLI/MCP release — independent of Lumen Core pager version.
# Triggers on tags that match packs/science/VERSION (e.g. v1.0.1).
# Does NOT build Desktop or Core agent.
name: Science Release

on:
  push:
    tags:
      - 'v1.*'
      - 'v2.*'
      - 'v3.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build artifacts without creating GitHub Release'
        type: boolean
        default: true
      allow_unsigned:
        description: 'Publish WITHOUT signatures (requires no signing key; users cannot verify the publisher)'
        type: boolean
        default: false

concurrency:
  group: science-release
  cancel-in-progress: false

# LS5-R1-01: read-only by default. Only the publish job widens to contents:write,
# and it does so behind a protected environment. Previously every job in this
# workflow — including ones that execute tag-controlled repository scripts —
# held a write-scoped token.
permissions:
  contents: read

jobs:
  preflight:
    name: Science version + gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      commit: ${{ steps.ver.outputs.commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v4
        with:
          fetch-depth: 0

      - name: Resolve science version
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < packs/science/VERSION)"
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Tag must match science VERSION for push-tag builds
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "${TAG}" != "v${VERSION}" ]]; then
              echo "FAIL: tag ${TAG} != v${VERSION} (packs/science/VERSION)"
              exit 1
            fi
          fi
          # LS5-R1-01: a manual run could previously publish from ANY branch by
          # synthesising TAG="v${VERSION}". Require the dispatched commit to be
          # an ancestor of the default branch, so a side branch cannot mint a
          # release that appears to come from mainline history.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            git fetch --no-tags origin "${DEFAULT_BRANCH}"
            if ! git merge-base --is-ancestor HEAD "origin/${DEFAULT_BRANCH}"; then
              echo "FAIL: HEAD ($(git rev-parse --short HEAD)) is not an ancestor of origin/${DEFAULT_BRANCH}"
              echo "      Manual science releases must be cut from mainline history."
              exit 1
            fi
          fi
          python3 scripts/science_release_contract.py preflight --root . --tag "${TAG}"

      - name: Machine gates
        run: bash scripts/science-machine-gates.sh

      - name: Go module boundary
        run: bash scripts/science-go-module-boundary.sh

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: '1.23'

      - name: Go tests
        working-directory: packs/science
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./mcp ./mcp/artifacts/... ./mcp/notebook/... ./mcp/reviewer/... \
            ./mcp/http_bridge/... \
            ./standalone/internal/seqbench/... ./standalone/internal/projectstore/... \
            -count=1 -timeout=90s

  rust:
    name: Rust science
    runs-on: ubuntu-latest
    needs: [preflight]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
      - name: cargo test
        run: cargo test -p xai-grok-science --lib --locked -- --test-threads=2
      - name: cargo clippy
        run: cargo clippy -p xai-grok-science --all-targets --locked -- -D warnings

  build:
    name: Cross-build release assets
    runs-on: ubuntu-latest
    needs: [preflight, rust]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: '1.23'

      # SOURCE_DATE_EPOCH must be the source commit's timestamp, not the build
      # clock — otherwise every rebuild of the same commit differs and the
      # manifest field is a provenance claim nothing can check.
      - name: Resolve SOURCE_DATE_EPOCH from the source commit
        id: sde
        run: |
          set -euo pipefail
          EPOCH="$(git show -s --format=%ct "${{ needs.preflight.outputs.commit }}")"
          echo "epoch=${EPOCH}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=${EPOCH} ($(date -u -d "@${EPOCH}" 2>/dev/null || true))"

      - name: make release
        working-directory: packs/science
        env:
          SOURCE_DATE_EPOCH: ${{ steps.sde.outputs.epoch }}
        run: make release VERSION="${{ needs.preflight.outputs.version }}"

      - name: Write publish manifest
        env:
          SOURCE_DATE_EPOCH: ${{ steps.sde.outputs.epoch }}
        run: |
          set -euo pipefail
          VER="${{ needs.preflight.outputs.version }}"
          COMMIT="${{ needs.preflight.outputs.commit }}"
          TAG="${{ needs.preflight.outputs.tag }}"
          OUT="packs/science/dist/science-release/MANIFEST.json"
          python3 - <<PY
          import json, os
          from pathlib import Path
          rel = Path("packs/science/dist/science-release")
          assets = []
          for p in sorted(rel.iterdir()):
              if p.name in ("MANIFEST.json", "SHA256SUMS") or p.is_dir():
                  continue
              if p.name.endswith(".json") and p.name.startswith("SCIENCE"):
                  continue
              import hashlib
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              assets.append({"name": p.name, "sha256": h, "size": p.stat().st_size})
          manifest = {
              "schemaVersion": 1,
              "product": "lumen-science-cli-mcp",
              "version": "${VER}",
              "tag": "${TAG}",
              "git_commit": "${COMMIT}",
              "versionSource": "packs/science/VERSION",
              "independentFromCore": True,
              "builder_workflow": "${{ github.workflow }}",
              "builder_run_id": "${{ github.run_id }}",
              "builder_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "source_date_epoch": int(os.environ["SOURCE_DATE_EPOCH"]),
              "assets": assets,
          }
          Path("${OUT}").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2)[:2000])
          PY
          test -f packs/science/dist/science-release/SHA256SUMS
          wc -l packs/science/dist/science-release/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: science-release-${{ needs.preflight.outputs.version }}-${{ github.sha }}
          path: packs/science/dist/science-release/*
          retention-days: 30
          if-no-files-found: error

  publish:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [preflight, build]
    # The only job that may write. Kept narrow deliberately: the jobs above run
    # tag-controlled repository scripts and must not hold a write token.
    permissions:
      contents: write
    # Protected environment gates who/what may publish. Configure required
    # reviewers and branch restrictions on `lumen-science-release` in repo
    # settings; without it this job is the whole security boundary.
    environment: lumen-science-release
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          name: science-release-${{ needs.preflight.outputs.version }}-${{ github.sha }}
          path: dist-out
          # Fail rather than publish bytes whose integrity the runner could not
          # confirm on download.
          digest-mismatch: error

      # Bind tag -> commit -> manifest before anything is published. Previously
      # nothing checked that the tag being released pointed at the commit that
      # was actually built: `--target` is only honoured when GitHub has to
      # create the tag, and the --clobber branch checked nothing at all.
      - name: Verify tag, commit and manifest agree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail

          # Annotated tags point at a tag object, which points at the commit.
          # Peel up to 8 levels rather than assuming a lightweight tag.
          peel_tag() {
            local encoded object_type object_sha
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$TAG")"
            read -r object_type object_sha <<<"$(gh api "repos/{owner}/{repo}/git/ref/tags/$encoded" --jq '[.object.type,.object.sha] | @tsv')"
            for _ in 1 2 3 4 5 6 7 8; do
              [[ "$object_type" == tag ]] || break
              read -r object_type object_sha <<<"$(gh api "repos/{owner}/{repo}/git/tags/$object_sha" --jq '[.object.type,.object.sha] | @tsv')"
            done
            [[ "$object_type" == commit ]] || return 1
            printf '%s\n' "$object_sha"
          }

          if PEELED="$(peel_tag)"; then
            echo "remote tag ${TAG} peels to ${PEELED}"
          else
            # No remote tag yet is legitimate for a manual run that will create it.
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              echo "FAIL: tag ${TAG} has no remote ref on a tag-push build"
              exit 1
            fi
            PEELED=""
          fi

          if [[ -n "$PEELED" && "$PEELED" != "$GITHUB_SHA" ]]; then
            echo "FAIL: tag ${TAG} -> ${PEELED} but this run built ${GITHUB_SHA}"
            exit 1
          fi
          if [[ "$COMMIT" != "$GITHUB_SHA" ]]; then
            echo "FAIL: preflight commit ${COMMIT} != run commit ${GITHUB_SHA}"
            exit 1
          fi

          MANIFEST_COMMIT="$(python3 -c 'import json,sys; print(json.load(open("dist-out/MANIFEST.json"))["git_commit"])')"
          MANIFEST_TAG="$(python3 -c 'import json,sys; print(json.load(open("dist-out/MANIFEST.json"))["tag"])')"
          if [[ "$MANIFEST_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "FAIL: MANIFEST.json git_commit ${MANIFEST_COMMIT} != ${GITHUB_SHA}"
            exit 1
          fi
          if [[ "$MANIFEST_TAG" != "$TAG" ]]; then
            echo "FAIL: MANIFEST.json tag ${MANIFEST_TAG} != ${TAG}"
            exit 1
          fi
          echo "OK: tag, run commit and manifest all agree on ${GITHUB_SHA}"

      # Re-hash every asset against SHA256SUMS before publishing. The build job
      # produced these bytes; this job must not take that on trust.
      - name: Verify asset digests against SHA256SUMS
        working-directory: dist-out
        run: |
          set -euo pipefail
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "OK: $(wc -l < SHA256SUMS) assets match SHA256SUMS"

      # Sign every published asset, so a user can verify WHO published it rather
      # than only that the bytes are self-consistent. A checksum file published
      # alongside the assets it describes proves nothing about origin: an
      # attacker who can replace one can replace both.
      #
      # Unsigned publication remains possible, but only as a deliberate,
      # recorded choice — never as the silent default it used to be.
      - name: Sign release assets
        id: sign
        env:
          SCIENCE_MINISIGN_PRIVATE_KEY: ${{ secrets.LUMEN_SCIENCE_MINISIGN_PRIVATE_KEY }}
          SCIENCE_MINISIGN_PUBLIC_KEY: ${{ vars.LUMEN_SCIENCE_MINISIGN_PUBLIC_KEY }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
        run: |
          set -euo pipefail

          if [[ -z "${SCIENCE_MINISIGN_PRIVATE_KEY:-}" ]]; then
            if [[ "${ALLOW_UNSIGNED}" == "true" ]]; then
              echo "::warning title=Unsigned release::No signing key configured and allow_unsigned=true. \
          Users will be unable to verify the publisher. See release/SCIENCE_RELEASE_SETUP.md."
              echo "signed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "FAIL: no LUMEN_SCIENCE_MINISIGN_PRIVATE_KEY configured."
            echo "      Configure signing (release/SCIENCE_RELEASE_SETUP.md tier 1),"
            echo "      or re-run with allow_unsigned=true to publish unsigned deliberately."
            exit 1
          fi
          [[ -n "${SCIENCE_MINISIGN_PUBLIC_KEY:-}" ]] || {
            echo "FAIL: private signing key is set but LUMEN_SCIENCE_MINISIGN_PUBLIC_KEY is not."
            echo "      Without the pinned public key the signature cannot be checked against a known identity."
            exit 1
          }

          # Checksum-pinned minisign. The digest is the same one release.yml:256
          # already pins for the core line — reused rather than re-derived so
          # both release chains trust one reviewed value.
          archive="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          printf '%s  %s\n' \
            '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73' \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
          install -m 755 "$RUNNER_TEMP/minisign-linux/x86_64/minisign" "$RUNNER_TEMP/minisign"
          [[ "$($RUNNER_TEMP/minisign -v)" == "minisign 0.12" ]]

          umask 077
          key="$RUNNER_TEMP/science.key"
          derived="$RUNNER_TEMP/derived.pub"
          trap 'rm -f "$key" "$derived"' EXIT
          printf '%s\n' "$SCIENCE_MINISIGN_PRIVATE_KEY" > "$key"

          # Derive the public key from the secret and compare against the pinned
          # variable. Catches a rotated, swapped or wrong-line-endings key before
          # anything is signed with an identity users do not trust.
          "$RUNNER_TEMP/minisign" -R -s "$key" -p "$derived"
          pinned="$(printf '%s\n' "$SCIENCE_MINISIGN_PUBLIC_KEY" | sed -n '2p')"
          [[ "$(sed -n '2p' "$derived")" == "$pinned" ]] || {
            echo "FAIL: signing secret does not derive the pinned public key"
            exit 1
          }

          printf '%s\n' "$SCIENCE_MINISIGN_PUBLIC_KEY" > dist-out/lumen-science.pub
          for asset in dist-out/*.tar.gz dist-out/*.zip dist-out/SHA256SUMS dist-out/MANIFEST.json; do
            [[ -f "$asset" ]] || continue
            "$RUNNER_TEMP/minisign" -S -s "$key" -m "$asset" \
              -t "lumen-science ${{ needs.preflight.outputs.tag }} ${GITHUB_SHA}"
            # Verify with the PINNED key, not the derived one: this proves the
            # signature checks out against what users will actually trust.
            "$RUNNER_TEMP/minisign" -V -p dist-out/lumen-science.pub -m "$asset"
            echo "  signed $(basename "$asset")"
          done
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Publish release (immutable; never clobbers)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VER: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          NOTES="Lumen Science CLI/MCP ${VER}

          - git_commit: ${COMMIT}
          - versionSource: packs/science/VERSION
          - independent of Lumen Core pager crate
          - built by workflow run ${{ github.run_id }}

          Verify: sha256sum -c SHA256SUMS
          "

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" dist-out/* \
              --title "Lumen Science CLI/MCP ${VER}" \
              --notes "$NOTES" \
              --target "$COMMIT" \
              --verify-tag
            echo "OK: created release ${TAG}"
            exit 0
          fi

          # A release already exists. Republishing is only allowed when it is
          # byte-identical to what we just built — that makes a re-run
          # idempotent without ever letting a second run replace shipped bytes.
          # `--clobber` used to do exactly that replacement, unconditionally.
          echo "release ${TAG} already exists — checking it is byte-identical"
          gh release view "$TAG" --json assets \
            --jq '.assets[] | [.name, .size] | @tsv' | sort > /tmp/remote-assets.tsv

          for f in dist-out/*; do
            printf '%s\t%s\n' "$(basename "$f")" "$(stat -c%s "$f")"
          done | sort > /tmp/local-assets.tsv

          if ! diff -u /tmp/remote-assets.tsv /tmp/local-assets.tsv; then
            echo "FAIL: published release ${TAG} differs from this build."
            echo "      Refusing to overwrite shipped assets. Cut a new version instead."
            exit 1
          fi
          echo "OK: ${TAG} already published with identical assets — nothing to do"
