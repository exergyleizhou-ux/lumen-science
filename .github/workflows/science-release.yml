# The public v1.0.1 Go CLI/MCP release remains immutable history.
#
# This workflow is deliberately incapable of building or publishing another
# independent Science execution product. Lumen Rust is the sole release and
# execution authority; compatibility adapters may return only after they are
# thin ACP clients bound to an official Lumen release manifest.
name: Legacy Science Go Release (frozen)

on:
  workflow_dispatch:

concurrency:
  group: legacy-science-go-release-frozen
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frozen:
    name: Independent Go release is retired
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the release boundary
        run: |
          set -euo pipefail
          {
            echo "### Independent Science Go release is frozen"
            echo
            echo "v1.0.1 is retained as immutable legacy history."
            echo "New Science execution capabilities ship only inside the canonical Rust Lumen release."
            echo "This workflow has no checkout, build, signing, artifact-upload, or release permission."
          } | tee -a "$GITHUB_STEP_SUMMARY"
