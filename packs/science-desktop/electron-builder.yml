# Lumen Science Desktop — packaging config (honest scaffold)
# Desktop version: package.json. Notarization: OFF until org certs exist.
# Auto-update feed: disabled until Lumen-owned signed feed exists.
appId: com.exergyleizhou-ux.lumen-science-desktop
productName: Lumen Science Desktop
copyright: Copyright © 2026 exergyleizhou-ux. Desktop UI adapted from Open Science (Apache-2.0).
directories:
  buildResources: build
afterPack: build/adhoc-sign.cjs
files:
  - '!**/.vscode/*'
  - '!.claude{,/**/*}'
  - '!.codex{,/**/*}'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!node_modules/@prisma/client{,/**/*}'
  - '!node_modules/.prisma{,/**/*}'
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*{,/**/*}'
  - '!node_modules/pdfjs-dist/build{,/**/*}'
  - '!node_modules/pdfjs-dist/web{,/**/*}'
  - '!node_modules/pdfjs-dist/image_decoders{,/**/*}'
  - '!node_modules/pdfjs-dist/types{,/**/*}'
  - '!node_modules/pdfjs-dist/**/*.map'
# Read-only data the Skills and Connectors tabs list. Both were resolved from
# process.cwd() relative to the repo, so in a packaged app they were simply not
# there — the Skills tab reported an empty inventory and the Connectors tab an
# error, on every real install. Shipping them as resources is what makes those
# tabs work outside a dev checkout.
extraResources:
  - from: ../../packs/science/skills/registry.json
    to: science/skills-registry.json
  - from: ../../packs/science/skills/ecosystem/scp-catalog.json
    to: science/ecosystem-skill-catalog.json
  - from: ../../packs/science/skills/ecosystem/biomni-tool-catalog.json
    to: science/biomni-tool-catalog.json
  - from: ../../packs/science/skills/ecosystem/biomni-resource-catalog.json
    to: science/biomni-resource-catalog.json
  - from: ../../docs/science/fusion-sources.lock.json
    to: science/fusion-sources.lock.json
  - from: ../../agent/crates/codegen/xai-grok-science/fixtures/connector_uniprot_search.json
    to: science/fixtures/connector_uniprot_search.json
  - from: ../../docs/science/5.0/admissions/biomni-query-uniprot.admission.json
    to: science/admissions/biomni-query-uniprot.json

asarUnpack:
  - resources/**
  - node_modules/@agentclientprotocol/claude-agent-acp/**
# Only ship paths that exist in-repo. Prisma / open-science/cli/micromamba
# staging dirs are intentionally omitted until CI stages them (builder warns
# and fails when from: paths are missing).
win:
  executableName: lumen-science-desktop
  artifactName: lumen-science-desktop-${version}-win-${arch}.${ext}
  target:
    - nsis
    - zip
nsis:
  artifactName: lumen-science-desktop-${version}-win-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  artifactName: lumen-science-desktop-${version}-mac-${arch}.${ext}
  minimumSystemVersion: '12.0.0'
  extendInfo:
    CFBundleName: Lumen Science Desktop
    CFBundleDisplayName: Lumen Science Desktop
  notarize: false
dmg:
  artifactName: lumen-science-desktop-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: exergyleizhou-ux
  category: Science
appImage:
  artifactName: lumen-science-desktop-${version}-linux-${arch}.${ext}
deb:
  artifactName: lumen-science-desktop_${version}_${arch}.${ext}
npmRebuild: false
# Auto-update DISABLED until Lumen-owned signed feed + rollback exist.
# Do not point at third-party open-science static feeds.
# publish: omitted intentionally (electron-builder --publish never)
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
